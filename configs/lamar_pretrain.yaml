data:
  dataset: lamar
  desc_fn: global-feats-netvlad.h5
  radio_dropout: 0.7
  batch_size: 32
  num_workers: 8
model:
  input_dim: 4096
  proj_dim: 512
  output_dim: 512
  K: 255
  L: 255
  num_layers: 0
  num_heads: 12
  affinity: []
  input_dropout: 0.2
  attn_dropout: 0.2
train:
  learning_rate: 1e-4
  lr_step: 1
  lr_gamma: 0.9
  weight_decay: 0.0
  num_epochs: 10
  freeze_input_proj: false
  checkpoint: null
