data:
  dataset: lamar
  desc_fn: global-feats-netvlad.h5
  radio_dropout: 0.7
  batch_size: 32
  num_workers: 8
model:
  input_dim: 4096
  proj_dim: 512
  output_dim: 512
  K: 127
  L: 127
  num_layers: 1
  num_heads: 8
  affinity: [positional-db, radio]
  input_dropout: 0.7
  attn_dropout: 0.7
train:
  learning_rate: 1e-4
  lr_step: 1
  lr_gamma: 0.9
  weight_decay: 1e-4
  num_epochs: 10
  freeze_input_proj: true
  checkpoint: null
